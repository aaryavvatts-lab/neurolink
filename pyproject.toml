[project]
name = "neurolink"
version = "0.1.0"
description = "Decoding visual perception from human intracranial LFP (ECoG)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "mne>=1.7",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "braindecode>=1.1",
    "nibabel>=5.2",
    "pyvista>=0.44",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "h5py>=3.11",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolink"]
